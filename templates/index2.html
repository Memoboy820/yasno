<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Анализ PDF</title>
    <style>
        body {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 16px;
            font-family: sans-serif;
        }

        button {
            margin-top: 16px;
            padding: 8px 16px;
        }

        pre {
            padding: 16px;
            background: #f2f2f2;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
    <h1>Анализ PDF</h1>

    <form id="form">
        <input
            id="files"
            type="file"
            accept=".pdf,application/pdf"
            multiple
            required
        >
        <br>
        <button id="button" type="submit">Отправить</button>
    </form>

    <pre id="output" role="status">Выбери PDF и нажми «Отправить».</pre>

    <script>
        const form = document.getElementById("form");
        const filesInput = document.getElementById("files");
        const button = document.getElementById("button");
        const output = document.getElementById("output");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const data = new FormData();

            for (const file of filesInput.files) {
                data.append("uploaded_files", file);
            }

            button.disabled = true;
            output.textContent = "Отправляем файлы. Ожидаем ответ ИИ...\n";

            const started = Date.now();
            const timer = setInterval(() => {
                output.textContent =
                    `Ожидаем ответ… ${Math.floor((Date.now() - started) / 1000)} сек.`;
            }, 1000);

            try {
                const response = await fetch(
                    "https://yasno-production-1945b59d.up.railway.app/multiple_files_upload",
                    {
                        method: "POST",
                        body: data
                    }
                );

                clearInterval(timer);
                output.textContent = `HTTP ${response.status}\nЧитаем ответ…`;

                const text = await response.text();

                output.textContent =
                    `HTTP ${response.status}\n\n` +
                    (text || "[Пустой ответ сервера]");
            } catch (error) {
                output.textContent = `Ошибка запроса:\n${error.message}`;
            } finally {
                clearInterval(timer);
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
