<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Анализ PDF</title>
    <style>
        body {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 16px;
            font-family: sans-serif;
        }

        button {
            margin-top: 16px;
            padding: 8px 16px;
        }

        pre {
            padding: 16px;
            background: #f2f2f2;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>
<body>
    <h1>Анализ PDF</h1>

    <form id="form">
        <input
            id="files"
            type="file"
            accept=".pdf,application/pdf"
            multiple
            required
        >
        <br>
        <button type="submit" value="free">
            Отправить бесплатно
        </button>
        <button type="submit" value="paid">
            Отправить платно
        </button>
    </form>

    <pre id="output" role="status">Выбери PDF и вариант отправки.</pre>

    <script>
        const form = document.getElementById("form");
        const filesInput = document.getElementById("files");
        const buttons = form.querySelectorAll('button[type="submit"]');
        const output = document.getElementById("output");

        const baseUrl = "https://yasno-production-1945b59d.up.railway.app";

        const endpoints = {
            free: "/free_multiple_files_upload",
            paid: "/paid_multiple_files_upload"
        };

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const mode = event.submitter?.value || "free";
            const data = new FormData();

            for (const file of filesInput.files) {
                data.append("uploaded_files", file);
            }

            buttons.forEach((button) => {
                button.disabled = true;
            });

            const modeLabel = mode === "paid" ? "Платный" : "Бесплатный";
            output.textContent =
                `${modeLabel} режим. Отправляем файлы. Ожидаем ответ ИИ...\n`;

            const started = Date.now();
            const timer = setInterval(() => {
                output.textContent =
                    `${modeLabel} режим. Ожидаем ответ… ` +
                    `${Math.floor((Date.now() - started) / 1000)} сек.`;
            }, 1000);

            try {
                const response = await fetch(
                    baseUrl + endpoints[mode],
                    {
                        method: "POST",
                        body: data
                    }
                );

                clearInterval(timer);
                output.textContent =
                    `HTTP ${response.status}\nЧитаем ответ…`;

                const text = await response.text();

                output.textContent =
                    `HTTP ${response.status}\n\n` +
                    (text || "[Пустой ответ сервера]");
            } catch (error) {
                output.textContent = `Ошибка запроса:\n${error.message}`;
            } finally {
                clearInterval(timer);

                buttons.forEach((button) => {
                    button.disabled = false;
                });
            }
        });
    </script>
</body>
</html>
